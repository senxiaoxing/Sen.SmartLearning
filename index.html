<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>希恩爱学习</title>

    <!-- iPad/iPhone 全屏 PWA：添加到主屏幕后无地址栏，viewport-fit 处理刘海屏 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- 主屏图标下显示的名字。⚠️ 与 vite.config.ts manifest 的 short_name 必须一致，
         否则 iOS 与 Android 显示两个不同的名字 -->
    <meta name="apple-mobile-web-app-title" content="希恩爱学习" />
    <meta name="theme-color" content="#FFF3E2" />

    <!-- iOS 不读 manifest 的 icons，必须单独给 apple-touch-icon。
         ⚠️ 用相对路径：GitHub Pages 部署在 /Sen.SmartLearning/ 子路径下，
         以 / 开头会指向 github.io 域名根，图标 404 变空白方块 -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />

    <!--
      在首帧之前打上皮肤属性。必须内联在这里，不能挪进 main.tsx：
      等模块加载完再设置的话，选了星际皮肤的用户每次冷启动都会先闪一帧奶油色。
      ⚠️ 'sen.skin' 与 src/platform/skin.ts 的 STORAGE_KEY 是同一个，改一处要改两处。
    -->
    <script>
      try {
        // 皮肤 id → 状态栏色。加新皮肤时这里和 src/platform/skin.ts 的 SKINS
        // 都要加一行，漏了这边的话那套皮肤每次冷启动都会先闪一帧默认色。
        var THEME = { jelly: '#FFF3E2', star: '#131A2E', meadow: '#F0F6EA' }
        var skin = localStorage.getItem('sen.skin')
        if (THEME[skin]) {
          document.documentElement.dataset.skin = skin
          document.querySelector('meta[name="theme-color"]').setAttribute('content', THEME[skin])
        }
      } catch (e) {
        /* 隐私模式下读不到 localStorage，用默认皮肤即可 */
      }
    </script>
    <script type="module" crossorigin src="/Sen.SmartLearning/assets/index-CM1XuhGL.js"></script>
    <link rel="stylesheet" crossorigin href="/Sen.SmartLearning/assets/index-DrRnv-rA.css">
  <link rel="manifest" href="/Sen.SmartLearning/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
  </body>
</html>
